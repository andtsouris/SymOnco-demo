[project]
name = "mtb-parser"
version = "0.1.0"
description = "Parser for standardized MTB whole-genome and whole-exome sequencing omics reports (PDF -> JSON)"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mtb-parser = "mtb_parser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
